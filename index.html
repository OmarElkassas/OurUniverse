<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nick & Judy World</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><link rel="stylesheet" href="style.css"></head><body><div id="toast"></div><section id="auth" class="auth"><div class="authcard"><div class="logo">N <i>&</i> J</div><h1>Welcome to Nick & Judy World</h1><p>Our Universe, one plan, memory and laugh at a time.</p><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Enter our universe</button><button class="ghost" onclick="signup()">Create account</button><small>Only the two approved accounts should be used.</small></div></section><div id="app" hidden><aside><div class="brand">N <i>&</i> J<small>OUR UNIVERSE</small></div><nav id="nav"></nav><button class="logout" onclick="logout()">Sign out</button></aside><main><header><button class="menu" onclick="document.body.classList.toggle('open')">☰</button><div><small>WELCOME HOME</small><h2 id="pageTitle">Dashboard</h2></div><button onclick="openAdd()">＋ Add</button></header><div id="content"></div></main></div><dialog id="modal"><form method="dialog" onsubmit="saveEntry(event)"><button class="x" value="cancel">×</button><h2>Add to our universe</h2><select id="fType"></select><input id="fTitle" placeholder="Title" required><input id="fCategory" placeholder="Category (you can create a new one)"><textarea id="fDetails" placeholder="Notes, ideas, conclusion or journal text"></textarea><div class="row"><select id="fStatus"><option>Idea</option><option>Discussing</option><option>Agreed</option><option>In Progress</option><option>Completed</option><option>Pending</option></select><input id="fDate" type="date"><input id="fBudget" type="number" placeholder="Budget"></div><input id="fPhoto" type="file" accept="image/*"><button type="submit">Save permanently</button></form></dialog><script src="app.js"></script></body></html>
