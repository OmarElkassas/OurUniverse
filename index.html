<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171512"><title>Omar &amp; Habiba | Our Universe</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="./style.css?v=30"></head><body><div id="toast"></div><section id="auth" class="auth"><div class="auth-card"><div class="monogram">O<span>&amp;</span>H</div><div class="eyebrow">OUR UNIVERSE</div><h1>Welcome home</h1><p>A private world for plans, honest talks, laughter and barakah.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Enter our universe</button><button id="signupBtn" class="ghost">Create account</button></div></section><div id="app" hidden><aside><div class="side-brand"><div class="monogram">O<span>&amp;</span>H</div><small>OUR UNIVERSE</small></div><nav id="nav"></nav><button id="logoutBtn" class="side-logout">Sign out</button></aside><main><header><button id="menuBtn" class="mobile-btn">☰</button><div><span class="eyebrow">WELCOME HOME</span><h2 id="pageTitle">Dashboard</h2></div><button id="pageAddBtn">＋ Add</button></header><div id="content"></div></main></div><dialog id="entryDialog"><form id="entryForm"><button type="button" class="close" data-close="entryDialog">×</button><input id="entryId" type="hidden"><input id="entryType" type="hidden"><input id="entryParent" type="hidden"><h2 id="entryDialogTitle">Add item</h2><label>Title<input id="entryTitle" required></label><label id="categoryLabel">Category<input id="entryCategory"></label><label>Notes<textarea id="entryDetails"></textarea></label><div class="form-grid"><label>Status<select id="entryStatus"><option>Idea</option><option>Pending</option><option>Discussing</option><option>Agreed</option><option>In Progress</option><option>Completed</option></select></label><label>Target date<input id="entryDate" type="date"></label><label>Budget<input id="entryBudget" type="number" min="0"></label></div><label>Reference photo<input id="entryPhoto" type="file" accept="image/*"></label><button type="submit">Save permanently</button></form></dialog><dialog id="dateDialog"><form id="dateForm"><button type="button" class="close" data-close="dateDialog">×</button><h2>Update our counters</h2><label>Relationship start<input id="relationshipDate" type="date" required></label><label>Next meeting<input id="meetingDate" type="datetime-local" required></label><button type="submit">Save dates</button></form></dialog><dialog id="deleteDialog"><div class="confirm"><h2>Delete this item?</h2><p>This also removes its nested sub-items.</p><button class="ghost" data-close="deleteDialog">Cancel</button><button id="confirmDelete" class="danger">Delete permanently</button></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js?v=30"></script><script src="./app.js?v=30"></script></body></html>
