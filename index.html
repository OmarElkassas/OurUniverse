<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171512"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Omar &amp; Habiba | Our Universe</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="./style.css?v=32"></head><body><div id="toast"></div><section id="auth" class="auth"><div class="auth-card"><div class="monogram">O<span>&amp;</span>H</div><div class="eyebrow">OUR UNIVERSE</div><h1>Welcome home</h1><p>A private world for plans, honest talks, laughter and barakah.</p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Enter our universe</button><button id="signupBtn" class="ghost">Create account</button></div></section><div id="app" hidden><div id="drawerOverlay" class="drawer-overlay"></div><aside id="drawer"><div class="drawer-head"><div><div class="monogram">O<span>&amp;</span>H</div><small>OUR UNIVERSE</small></div><button id="closeDrawer" class="icon ghost" aria-label="Close menu">×</button></div><nav id="nav"></nav><button id="logoutBtn" class="side-logout">Sign out</button></aside><main><header><button id="menuBtn" class="icon" aria-label="Open menu">☰</button><div class="header-copy"><span class="eyebrow">OUR UNIVERSE</span><h2 id="pageTitle">Home</h2></div><button id="pageAddBtn" class="desktop-add">＋ Add</button></header><div id="content"></div><button id="fab" class="fab" aria-label="Add item">＋</button></main><nav class="bottom-nav" id="bottomNav"><button data-tab="dashboard"><span>⌂</span>Home</button><button da
